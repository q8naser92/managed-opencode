name: Managed macOS engine validation (not a client release)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-macos-validation
  cancel-in-progress: false

jobs:
  windows-server:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Test Windows server policy and authentication
        working-directory: managed-harness-platform
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test test
          exit $LASTEXITCODE

  macos-engine:
    needs: windows-server
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Build and execute tests on actual macOS
        shell: bash
        env:
          EXPECTED_MAC_ARCH: ${{ matrix.arch }}
        run: bash managed-harness-platform/cloud/validate-macos.sh
      - name: Preserve test evidence and unsigned engine
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-engine-validation-${{ matrix.arch }}
          path: macos-evidence/
          retention-days: 7
          if-no-files-found: error
